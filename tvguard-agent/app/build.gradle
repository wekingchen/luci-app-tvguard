plugins {
    id 'com.android.application'
}
android {
    namespace 'com.tvguard.agent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tvguard.agent'
        minSdk 23
        targetSdk 23
        versionCode 7
        versionName '0.2.5'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
