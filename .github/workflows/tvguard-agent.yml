name: TVGuard Agent Android 6 build

on:
  push:
    branches:
      - feature/tvguard-agent-android6-v0.1.0
  pull_request:
    paths:
      - 'tvguard-agent/**'
      - '.github/workflows/tvguard-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check no-write source contract
        run: python3 tvguard-agent/tests/test_source_guards.py
      - name: Build APK for API 23
        working-directory: tvguard-agent
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK and size
        shell: bash
        run: |
          set -euo pipefail
          APK=tvguard-agent/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test "$(stat -c%s "$APK")" -lt 1048576
          unzip -l "$APK" | grep -q classes.dex
          echo "APK bytes: $(stat -c%s "$APK")"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: tvguard-agent-0.1.0-android6-apk
          path: tvguard-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
