name: Agent + N1 bridge shadow integration

on:
  push:
    branches: [feat/v0.1.13-agent-integration]
    paths:
      - 'bridge/**'
      - 'scripts/build-agent-bridge-ipk.sh'
      - '.github/workflows/tvguard-agent-bridge.yml'
  pull_request:
    paths:
      - 'bridge/**'
      - 'scripts/build-agent-bridge-ipk.sh'
      - '.github/workflows/tvguard-agent-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce v0.1.13 smart-billing baseline and core isolation
        shell: bash
        run: |
          set -euo pipefail
          test -f root/usr/libexec/tvguard-adaptive
          test -f root/usr/libexec/tvguard-learn
          test -f root/usr/libexec/tvguard-soak
          git fetch --depth=1 origin feat/v0.1.13-smart-billing
          git diff --name-only FETCH_HEAD HEAD | while IFS= read -r changed; do
            case "$changed" in
              bridge/*|tvguard-agent/*|scripts/build-agent-bridge-ipk.sh|.github/workflows/tvguard-agent.yml|.github/workflows/tvguard-agent-bridge.yml)
                : ;;
              *)
                echo "::error::Unexpected change to existing smart-billing core: $changed"
                exit 1 ;;
            esac
          done
          echo "smart-billing baseline and non-overwrite gate: PASS"
      - name: Check executable scripts and isolation
        shell: bash
        run: |
          set -euo pipefail
          for file in bridge/root/www/cgi-bin/tvguard-agent bridge/root/usr/libexec/tvguard-agent-bridge-report bridge/root/usr/libexec/tvguard-agent-bridge-soak bridge/root/usr/libexec/tvguard-agent-bridge-pair bridge/root/etc/init.d/tvguard-agent-bridge bridge/ipkg/postinst bridge/ipkg/prerm scripts/build-agent-bridge-ipk.sh; do
            dash -n "$file"
          done
          python3 bridge/tests/test_source_contract.py
      - name: Verify installation on BusyBox without od and repair malformed key
        run: python3 bridge/tests/test_busybox_postinst.py
      - name: Run one-shot remote pairing protocol and security tests
        run: python3 bridge/tests/test_pairing.py
      - name: Run testable bridge HTTP ingress contract
        run: python3 bridge/tests/test_http_bridge.py
      - name: Package standalone OpenWrt companion IPK
        run: |
          sh scripts/build-agent-bridge-ipk.sh
          tar -tzf dist/tvguard-agent-bridge_0.2.3-1_all.ipk | grep -q './data.tar.gz'
          tar -xOzf dist/tvguard-agent-bridge_0.2.3-1_all.ipk ./data.tar.gz | tar -tzf - | grep -q './www/cgi-bin/tvguard-agent'
          tar -xOzf dist/tvguard-agent-bridge_0.2.3-1_all.ipk ./control.tar.gz | tar -tzf - > /tmp/bridge-control-list
          ! grep -q 'conffiles$' /tmp/bridge-control-list
          tar -xOzf dist/tvguard-agent-bridge_0.2.3-1_all.ipk ./control.tar.gz | tar -xOzf - ./control | grep -q 'Version: 0.2.3-1'
      - uses: actions/upload-artifact@v4
        with:
          name: tvguard-agent-bridge-0.2.3-ipk
          path: dist/tvguard-agent-bridge_0.2.3-1_all.ipk
          retention-days: 7
