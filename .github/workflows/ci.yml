name: TV Guard static checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        shell: bash
        run: |
          set -eu
          find root/usr/libexec root/etc/init.d ipkg -type f \
            \( -name 'tvguard*' -o -name 'postinst' -o -name 'prerm' \) |
          while read -r file; do
            sh -n "$file"
            dash -n "$file"
          done
      - name: Validate LuCI JSON and JavaScript syntax
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('root/usr/share').rglob('*.json'):
              json.loads(path.read_text())
              print('JSON OK', path)
          PY
          node - <<'JS'
          const fs = require('fs');
          for (const p of ['htdocs/luci-static/resources/view/tvguard/overview.js',
                           'htdocs/luci-static/resources/view/tvguard/settings.js']) {
              new Function(fs.readFileSync(p, 'utf8'));
              console.log('JS syntax OK:', p);
          }
          JS
      - name: Exercise controller in mock FW3 environment
        run: |
          set -eu
          dash tests/test-controller.sh
      - name: Exercise mock firewall3 rule lifecycle
        run: |
          set -eu
          dash tests/test-firewall.sh
      - name: Check intended safeguards
        shell: bash
        run: |
          set -eu
          grep -q "option enforce '0'" root/etc/config/tvguard
          grep -q 'TVG_COUNT' root/usr/libexec/tvguard-fw
          grep -q '"read"' root/usr/share/rpcd/acl.d/luci-app-tvguard.json
          ! grep -q '"/bin/sh"' root/usr/share/rpcd/acl.d/luci-app-tvguard.json
          ! grep -q 'TVGUARD_FW' root/usr/libexec/tvguardctl
          ! grep -q 'TVGUARD_RUN' root/usr/libexec/tvguardctl
          grep -q 'allow_enforcement' root/etc/config/tvguard
          grep -q 'sample)' root/usr/libexec/tvguard-fw

  package:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Build development IPK
        run: |
          set -eu
          sh scripts/build-ipk.sh 0.1.0
          test -f dist/luci-app-tvguard_0.1.0-1_all.ipk
          ar t dist/luci-app-tvguard_0.1.0-1_all.ipk | grep -q data.tar.gz
          ar p dist/luci-app-tvguard_0.1.0-1_all.ipk data.tar.gz |
            tar tzf - | grep -q './usr/libexec/tvguardctl'
      - name: Upload development IPK
        uses: actions/upload-artifact@v4
        with:
          name: tvguard-v0.1.0-development-ipk
          path: dist/*.ipk
          if-no-files-found: error
