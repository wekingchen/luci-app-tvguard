name: TV Guard static checks

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        shell: bash
        run: |
          set -eu
          find root/usr/libexec root/etc/init.d ipkg -type f \
            \( -name 'tvguard*' -o -name 'postinst' -o -name 'prerm' \) |
          while read -r file; do
            sh -n "$file"
            dash -n "$file"
          done
      - name: Validate LuCI JSON and JavaScript syntax
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('root/usr/share').rglob('*.json'):
              json.loads(path.read_text())
              print('JSON OK', path)
          PY
          node - <<'JS'
          const fs = require('fs');
          for (const p of ['htdocs/luci-static/resources/view/tvguard/overview.js',
                           'htdocs/luci-static/resources/view/tvguard/settings.js']) {
              new Function(fs.readFileSync(p, 'utf8'));
              console.log('JS syntax OK:', p);
          }
          JS
      - name: Execute LuCI page with mock DOM and calibrated states
        run: node tests/test-ui.js
      - name: Verify optional Bark report timing and retry
        run: dash tests/test-daily-report.sh
      - name: Validate LuCI settings hierarchy and safety
        run: node tests/test-settings-ui.js
      - name: Validate LuCI overview/settings tab structure
        run: node tests/test-menu-ui.js
      - name: Verify LuCI read wrapper command allowlist
        run: dash tests/test-status-wrapper.sh
      - name: Exercise controller in mock FW3 environment
        run: |
          set -eu
          dash tests/test-controller.sh
      - name: Exercise deterministic policy/state unit tests
        run: dash tests/test-policy.sh
      - name: Exercise formal enforcement state machine
        run: dash tests/test-enforcement.sh
      - name: Enforce proxy isolation contract
        run: python3 tests/test-proxy-isolation.py
      - name: Exercise read-only runtime isolation audit
        run: dash tests/test-isolation-audit.sh
      - name: Verify integrated package ownership and uninstall isolation
        run: dash tests/test-package-safety.sh
      - name: Verify firewall include cannot fail proxy reload
        run: dash tests/test-firewall-include.sh
      - name: Exercise procd service lifecycle
        run: dash tests/test-init-service.sh
      - name: Exercise daemon tick loop behavior
        run: dash tests/test-daemon.sh
      - name: Exercise one-shot proxy compatibility checker
        run: dash tests/test-compat-check.sh
      - name: Exercise firewall reload policy unit tests
        run: dash tests/test-firewall-policy.sh
      - name: Exercise mock firewall3 rule lifecycle
        run: |
          set -eu
          dash tests/test-firewall.sh
      - name: Validate shadow recognition evidence policy
        run: python3 tests/test-calibration.py
      - name: Test conservative shadow fingerprint suggestions
        run: |
          set -eu
          dash tests/test-shadow.sh
      - name: Test automatic learning-session analysis
        run: dash tests/test-learning.sh
      - name: Test Adaptive Engine Phase 2A pause prototypes
        run: dash tests/test-adaptive.sh
      - name: Enforce bounded persistent storage
        run: dash tests/test-retention.sh
      - name: Validate durable mmc data migration
        run: dash tests/test-data-root.sh
      - name: Validate UCI config persistence install semantics
        run: dash tests/test-config-persistence.sh
      - name: Simulate v0.1.13 to integrated v0.1.14 no-loss upgrade
        run: dash tests/test-integrated-upgrade.sh
      - name: Validate bounded Shadow Soak observer
        run: dash tests/test-soak.sh
      - name: Validate unseen-app generalization and safe refusal
        run: python3 tests/test-generalization.py
      - name: Check intended safeguards
        shell: bash
        run: |
          set -eu
          grep -q "option enforce '0'" root/etc/config/tvguard
          grep -q 'TVG_COUNT' root/usr/libexec/tvguard-fw
          grep -q '"read"' root/usr/share/rpcd/acl.d/luci-app-tvguard.json
          ! grep -q '"/bin/sh"' root/usr/share/rpcd/acl.d/luci-app-tvguard.json
          ! grep -q 'TVGUARD_FW' root/usr/libexec/tvguardctl
          ! grep -q 'TVGUARD_RUN' root/usr/libexec/tvguardctl
          grep -q 'allow_enforcement' root/etc/config/tvguard
          grep -q 'sample)' root/usr/libexec/tvguard-fw
          grep -q "option observe_reply '0'" root/etc/config/tvguard
          grep -q "option bark_key2 ''" root/etc/config/tvguard
          grep -q 'bark_key2' htdocs/luci-static/resources/view/tvguard/settings.js
          grep -q 'TVG_RX_LAN' root/usr/libexec/tvguard-fw
          grep -q 'TVG_RX_LOCAL' root/usr/libexec/tvguard-fw
          grep -q 'reply_coverage' root/usr/libexec/tvguardctl
          grep -q 'proxy isolation audit is not ok' root/usr/libexec/tvguardctl
          grep -q 'isolation)' root/usr/libexec/tvguard-status
          grep -q 'tvguard-isolation-audit' scripts/build-ipk.sh
          grep -q 'tvguard-compat-check' scripts/build-ipk.sh
          grep -q 'TX_IDLE_BILLING_AUTHORITY=0' root/usr/libexec/tvguardctl
          grep -q 'AGENT_BILLING=/usr/libexec/tvguard-agent-billing-hint' root/usr/libexec/tvguardctl
          grep -q 'system_home|app_home) HOME_FREE_REASON=' root/usr/libexec/tvguardctl
          grep -q 'idle_grace' root/usr/libexec/tvguardctl
          grep -q 'BUILD_ID_FILE' root/usr/libexec/tvguardctl
          grep -q 'tvguard-learn' scripts/build-ipk.sh
          grep -q 'tvguard-adaptive' scripts/build-ipk.sh
          grep -q 'ADAPTIVE_STATE' root/usr/libexec/tvguardctl
          grep -q 'ADAPTIVE_PAUSE_HINT' root/usr/libexec/tvguardctl
          grep -q 'high_ratio_pause' root/usr/libexec/tvguard-adaptive
          grep -q 'learning)' root/usr/libexec/tvguard-status
          grep -q 'storage)' root/usr/libexec/tvguard-status
          grep -q 'soak)' root/usr/libexec/tvguard-status
          grep -q 'SOAK=/usr/libexec/tvguard-soak' root/usr/libexec/tvguardctl
          grep -q 'MAX_LINES=2160' root/usr/libexec/tvguard-soak
          grep -q 'SCHEMA=v2' root/usr/libexec/tvguard-soak
          grep -q 'TCP_PPS' root/usr/libexec/tvguard-soak
          grep -q 'UDP占比' root/usr/libexec/tvguard-soak-report
          grep -q '不代表暂停概率' htdocs/luci-static/resources/view/tvguard/overview.js
          grep -q '1048576 bytes (1 MiB)' root/usr/libexec/tvguard-retention
          grep -q '/mnt/mmcblk2p4' root/usr/libexec/tvguard-data
          grep -q 'tvguard-data' scripts/build-ipk.sh
          grep -q 'tvguard-v014-upgrade' ipkg/preinst
          grep -q 'agent-bridge.key' ipkg/preinst
          grep -q 'restore-config' ipkg/postinst
          grep -q 'state_covers_snapshot' ipkg/postinst
          grep -q 'default-config' scripts/verify-ipk.py
          grep -q 'system_home system 100' root/usr/libexec/tvguard-shadow
          grep -q 'flow_offload_observation_risk' root/usr/libexec/tvguard-compat-check
          grep -q 'stable_low_plateau' root/usr/libexec/tvguard-soak
          grep -q 'TEMPORAL_ENTERS' root/usr/libexec/tvguard-soak-report
          grep -q '\[ "\$TEMPORAL_SPREAD" -le 10 \]' root/usr/libexec/tvguard-soak
          grep -q 'TEMPORAL_STATE_SCHEMA=v2' root/usr/libexec/tvguard-soak
          grep -q '\[ "\$TEMPORAL_P50" -gt 0 \]' root/usr/libexec/tvguard-soak

  package:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate OpenWrt-compatible development IPK
        run: |
          set -eu
          sh scripts/build-ipk.sh 0.1.14 2
          PKG=dist/luci-app-tvguard_0.1.14-2_all.ipk
          test -f "$PKG"
          # OpenWrt ipkg-build uses gzip-compressed tar, not Debian ar.
          test "$(od -An -tx1 -N2 "$PKG" | tr -d ' \n')" = 1f8b
          tar -tzf "$PKG" | grep -q './control.tar.gz'
          python3 scripts/verify-ipk.py "$PKG" 0.1.14 2
          sha256sum "$PKG"
      - name: Upload development IPK
        uses: actions/upload-artifact@v4
        with:
          name: tvguard-v0.1.14-r2-confirmed-pause-free-ipk
          path: dist/*.ipk
          if-no-files-found: error
