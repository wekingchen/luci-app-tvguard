name: TV Guard stable release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid RELEASE_VERSION: $VERSION" >&2; exit 1 ;;
          esac
          BUILD_VERSION="$(sed -n 's/^VERSION="${1:-\([^"]*\)}"/\1/p' scripts/build-ipk.sh)"
          [ "$VERSION" = "$BUILD_VERSION" ] || {
            echo "RELEASE_VERSION=$VERSION does not match build default=$BUILD_VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and validate release IPK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          sh scripts/build-ipk.sh "$VERSION"
          PKG="dist/luci-app-tvguard_${VERSION}-1_all.ipk"
          test -f "$PKG"
          test "$(od -An -tx1 -N2 "$PKG" | tr -d ' \n')" = 1f8b
          tar -tzf "$PKG" | grep -q './control.tar.gz'
          python3 scripts/verify-ipk.py "$PKG" "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          PKG="dist/luci-app-tvguard_${VERSION}-1_all.ipk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          首个稳定候选版本，已在 Phicomm N1 / LEDE R26.11.3 / fw3 / iptables-legacy 环境完成真机核心闭环验证。

          已验证：
          - 儿童/家长/手动锁定模式；
          - 工作日/周末额度与允许时段；
          - +15/+30/+60 分钟奖励与撤销；
          - 儿童额度耗尽自动阻断、奖励恢复、撤销后重新阻断；
          - 正式控制下 locked → DROP、parent → RETURN；
          - TV Guard service reload 策略保持；
          - 全局 fw3/firewall reload 后 TVG hook 与 gate 自动重建；
          - N1 整机重启后模式、已用额度和 DROP/RETURN gate 持久恢复；
          - 代理隔离检查 PASS，非 TVG 规则保持不变。

          安全边界：
          - 默认 enforce=0、allow_enforcement=0、observe_reply=0；
          - 正式控制仍需要双开关及运行时 isolation audit=ok；
          - 实验性回程观测保持默认关闭，不属于稳定核心功能；
          - 当前网络控制仅覆盖实际经过 N1 的目标电视 IPv4 流量。
          EOF

          gh release create "$TAG" "$PKG" \
            --target "$GITHUB_SHA" \
            --title "TV Guard v$VERSION" \
            --notes-file /tmp/release-notes.md

      - name: Remove merged development branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/initial-shadow-mvp" \
            >/dev/null 2>&1 || true
