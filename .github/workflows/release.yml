name: TV Guard stable release

on:
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid RELEASE_VERSION: $VERSION" >&2; exit 1 ;;
          esac
          BUILD_VERSION="$(sed -n 's/^VERSION="${1:-\([^"]*\)}"/\1/p' scripts/build-ipk.sh)"
          BUILD_RELEASE="$(sed -n 's/^RELEASE="${2:-\([^"]*\)}"/\1/p' scripts/build-ipk.sh)"
          [ "$VERSION" = "$BUILD_VERSION" ] || {
            echo "RELEASE_VERSION=$VERSION does not match build default=$BUILD_VERSION" >&2
            exit 1
          }
          case "$BUILD_RELEASE" in ''|*[!0-9]*) echo "invalid build release: $BUILD_RELEASE" >&2; exit 1 ;; esac
          AGENT_VERSION="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" tvguard-agent/app/build.gradle | head -n1)"
          AGENT_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' tvguard-agent/app/build.gradle | head -n1)"
          test -n "$AGENT_VERSION"
          case "$AGENT_CODE" in ''|*[!0-9]*) echo "invalid Agent versionCode: $AGENT_CODE" >&2; exit 1 ;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_release=$BUILD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "agent_version=$AGENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "agent_code=$AGENT_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and validate main IPK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE="${{ steps.version.outputs.package_release }}"
          sh scripts/build-ipk.sh "$VERSION" "$RELEASE"
          PKG="dist/luci-app-tvguard_${VERSION}-${RELEASE}_all.ipk"
          test -f "$PKG"
          test "$(od -An -tx1 -N2 "$PKG" | tr -d ' \n')" = 1f8b
          tar -tzf "$PKG" | grep -q './control.tar.gz'
          python3 scripts/verify-ipk.py "$PKG" "$VERSION" "$RELEASE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] ||
             [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare permanent Agent release keystore
        shell: bash
        env:
          TVGUARD_KEYSTORE_B64: ${{ secrets.TVGUARD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$TVGUARD_KEYSTORE_B64"
          KEYSTORE="$RUNNER_TEMP/tvguard-release.p12"
          printf '%s' "$TVGUARD_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          ACTUAL_SHA256="$(sha256sum "$KEYSTORE" | awk '{print $1}')"
          EXPECTED_SHA256="96e920be816ff3a59c8b914f99909a5da9c6c59b07ccc833ee901b2700bc74a8"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          echo "TVGUARD_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build permanently signed TV Agent APK
        working-directory: tvguard-agent
        env:
          TVGUARD_STORE_PASSWORD: ${{ secrets.TVGUARD_STORE_PASSWORD }}
          TVGUARD_KEY_ALIAS: ${{ secrets.TVGUARD_KEY_ALIAS }}
          TVGUARD_KEY_PASSWORD: ${{ secrets.TVGUARD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify Agent APK signature and stage release asset
        shell: bash
        run: |
          set -euo pipefail
          SRC="tvguard-agent/app/build/outputs/apk/release/app-release.apk"
          AGENT_VERSION="${{ steps.version.outputs.agent_version }}"
          APK="dist/tvguard-agent_${AGENT_VERSION}-release-signed.apk"
          test -s "$SRC"
          test "$(stat -c%s "$SRC")" -lt 1048576
          unzip -l "$SRC" | grep -q classes.dex
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" |
            tee "$RUNNER_TEMP/apksigner.txt"
          EXPECTED_CERT_SHA256="f4c300999b1bb3f04f4f80a630ebd5273dd268810a35b25b6c4c60a63cf376fa"
          ACTUAL_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" |
            head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          cp "$SRC" "$APK"
          test -s "$APK"
          echo "Release signer SHA256 verified: $ACTUAL_CERT_SHA256"

      - name: Publish or refresh complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE="${{ steps.version.outputs.package_release }}"
          TAG="${{ steps.version.outputs.tag }}"
          PKG="dist/luci-app-tvguard_${VERSION}-${RELEASE}_all.ipk"
          AGENT_VERSION="${{ steps.version.outputs.agent_version }}"
          AGENT_CODE="${{ steps.version.outputs.agent_code }}"
          APK="dist/tvguard-agent_${AGENT_VERSION}-release-signed.apk"
          test -s "$PKG"
          test -s "$APK"

          cat > /tmp/release-notes.md <<EOF
          TV Guard v${VERSION}-r${RELEASE}：Agent Bridge 已整合进 N1 主包，电视 Agent 为 ${AGENT_VERSION}（versionCode ${AGENT_CODE}）。

          本 Release 只需要两个安装文件：
          - N1 路由器：luci-app-tvguard_${VERSION}-${RELEASE}_all.ipk
          - 小米 Android 6 电视：tvguard-agent_${AGENT_VERSION}-release-signed.apk

          v0.1.14-r7 已完成小米电视真机验收：UsageEvents/full-context、系统首页与 App 首页免计时、
          人工 playing/paused 联合学习、低码率播放继续计时、暂停两次 fresh Agent 心跳后免计时、
          静音播放不误判暂停、play → pause → play 儿童模式计时闭环，以及 Agent 进程被 kill 后自动恢复。

          N1 只需安装主 IPK；CGI、Fusion、billing hint、配对与 Bridge 服务均已包含。
          旧独立 tvguard-agent-bridge 会由 opkg Conflicts/Replaces 正规迁移，配对密钥、UCI 和持久观看数据保留。

          正式计时仍保持 fail-closed：Agent stale/package-only/unknown Activity、普通网络 pause hint、
          unknown/ambiguous 均不会获得暂停免计时权限。learned-audio 暂停只对同一 exact package+Activity
          的成对高可信 playing/paused 人工画像生效。

          电视 APK 使用固定签名证书，可覆盖升级而不清除应用数据。
          腾讯、爱奇艺等其它视频 App 的逐 App 画像与跨 App 泛化验证属于后续阶段，不影响本次 r7 已验收能力。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Remove stale Agent assets left by older hard-coded filenames so
            # each stable release exposes exactly one current signed APK.
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                case "$asset" in
                  tvguard-agent_*-release-signed.apk)
                    [ "$asset" = "$(basename "$APK")" ] ||
                      gh release delete-asset "$TAG" "$asset" --yes
                    ;;
                esac
              done
            gh release edit "$TAG" --title "TV Guard v$VERSION" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "$PKG" "$APK" --clobber
          else
            gh release create "$TAG" "$PKG" "$APK" --target "$GITHUB_SHA" --title "TV Guard v$VERSION" --notes-file /tmp/release-notes.md
          fi

      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/tvguard-release.p12"

      - name: Remove merged development branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            feat/initial-shadow-mvp \
            feat/v0.1.13-agent-integration \
            feat/v0.1.13-smart-billing \
            feat/v0.1.14-integrated-agent-bridge \
            chore/v0.1.14-release-refresh; do
            encoded="${branch//\//%2F}"
            # Best-effort cleanup only; release success must not depend on an
            # already-deleted development branch.
            gh api -X DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" \
              >/dev/null 2>&1 || true
          done
